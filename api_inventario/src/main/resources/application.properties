spring.application.name=api_inventario
# Lectura del .env
spring.config.import=optional:file:.env[.properties],optional:file:./api_usuarios/.env[.properties]


# puerto
server.port=${SERVER_PORT:8083}

# conf base de datos
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:inventario_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:hola123}

# driver mysql
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

#config aws3
aws.region=us-east-1
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME:bucket-inventario-aws-783715491236-us-east-1-an}

