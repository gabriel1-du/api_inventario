# =============================================================================
# PRODUCCIÓN - EC2 (api_inventario)
# Adaptado de otros/docker-compose.prod.yml + configuración AWS del microservicio.
# Ubicado en la raíz del proyecto, al mismo nivel que .dockerignore.
#
# Solo levanta el microservicio. NO levanta MySQL ni SeaweedFS:
# RDS y AWS S3 se alcanzan por variables de entorno (.env.prod).
#
# Uso:
#   cp .env.prod.example .env.prod      # editar con los datos reales
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#   ./otros/deploy.sh main
# =============================================================================

services:
  api-inventario:
    image: api-inventario:prod
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api-inventario-prod
    restart: unless-stopped

    # ---------- Control de RAM para una EC2 pequeña (t3.micro / 1 GB) ----------
    # Tope real del contenedor: 768 MiB. La JVM usa el 75% (~576 MB de heap)
    # gracias a MaxRAMPercentage configurado en el Dockerfile.
    mem_limit: 768m
    mem_reservation: 512m
    # -------------------------------------------------------------------------

    # RDS, bucket, región, credenciales IAM, etc. vienen de acá
    env_file:
      - .env.prod

    environment:
      # Fuerza AWS real: anula un AWS_S3_ENDPOINT local que haya quedado copiado.
      AWS_S3_ENDPOINT: ""
      AWS_REGION: "${AWS_REGION:-us-east-1}"
      SPRING_PROFILES_ACTIVE: prod

      # JVM: hereda el default del Dockerfile, pero se puede override desde .env.prod
      JAVA_TOOL_OPTIONS: "${JAVA_TOOL_OPTIONS:--XX:+UseContainerSupport -XX:MaxRAMPercentage=75 -XX:InitialRAMPercentage=50}"

      SPRING_JPA_SHOW_SQL: "false"
      SPRING_JPA_HIBERNATE_DDL_AUTO: "${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}"
      TZ: "${TZ:-UTC}"

    ports:
      # HOST_PORT = puerto expuesto en la EC2 / ALB; SERVER_PORT = puerto de la app
      - "${HOST_PORT:-8083}:${SERVER_PORT:-8083}"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      # eclipse-temurin:alpine trae busybox nc (no necesitamos Spring Actuator).
      test: ["CMD-SHELL", "nc -z 127.0.0.1 $${SERVER_PORT:-8083} || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
